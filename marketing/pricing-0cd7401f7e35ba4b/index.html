<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="referrer" content="no-referrer" />
<title>ClinicOS — Pricing</title>
<style>
:root{--ink:#0E2233;--brand:#1F4E79;--teal:#148F77;--bg:#FBFDFE;--line:#E4EBF1;--muted:#57697A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,"Noto Sans Ethiopic",sans-serif;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:19px;color:var(--brand)}
.lang button{border:1px solid var(--line);background:#fff;padding:6px 12px;cursor:pointer;font:inherit;font-weight:600}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0}
.lang button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h1{font-size:clamp(28px,4vw,42px);margin:44px 0 10px;line-height:1.15}
.sub{color:var(--muted);font-size:17px;max-width:640px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.card.star{border-color:var(--teal);box-shadow:0 20px 50px -30px rgba(16,42,67,.5)}
.card h3{margin:0;font-size:20px}
.price{font-size:32px;font-weight:700;margin:12px 0 4px}
.price small{font-size:13px;color:var(--muted);font-weight:500}
.card p{color:var(--muted);font-size:14px;margin:6px 0 0}
h2{font-size:24px;margin:44px 0 6px}
table{width:100%;border-collapse:collapse;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{background:#F6F9FB;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.r,th.r{text-align:right;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.note{margin-top:16px;padding:14px 16px;border-left:4px solid var(--teal);background:#F2FBF8;font-size:14.5px}
.note.warn{border-color:#B9822B;background:#FDF8EE}
footer{color:var(--muted);font-size:13px;text-align:center;padding:36px 0 46px}
.calc{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow small{display:block;color:var(--muted);font-size:13px}
.step{display:flex;align-items:center;gap:10px;white-space:nowrap}
.step button,.tog{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:20px;cursor:pointer;font-family:inherit}
.tog{width:auto;padding:0 14px;font-size:14px;font-weight:600}
.tog.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.step b{min-width:64px;text-align:center}
.sum{background:#0E2233;color:#DCE8F1;border-radius:16px;padding:22px;align-self:start}
.sum .big{font-size:34px;font-weight:700;color:#fff}
.sum .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#A9C1D4;margin-top:14px}
.sum .lbl:first-child{margin-top:0}
@media(max-width:760px){.calc{grid-template-columns:1fr}}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="logo">ClinicOS</span>
  <span class="lang"><button id="b-en" class="on">English</button><button id="b-am">አማርኛ</button></span>
</header>

<h1 data-en="Pay once. Bring clinics. Pay less." data-am="አንድ ጊዜ ይክፈሉ። ክሊኒኮችን ያምጡ። ያነሰ ይክፈሉ።"></h1>
<p class="sub" data-en="Records, tooth charts, treatment plans, instalments, front desk and cashier — in one place, in Ethiopian birr." data-am="መዝገቦች፣ የጥርስ ቻርት፣ የሕክምና ዕቅድ፣ ክፍያ በዕቅድ፣ መቀበያ እና ገንዘብ ያዥ — በአንድ ቦታ፣ በኢትዮጵያ ብር።"></p>

<h2 data-en="2-year packages" data-am="የ2 ዓመት ፓኬጆች"></h2>
<div class="grid" style="grid-template-columns:repeat(2,1fr)">
  <div class="card star">
    <h3 data-en="2 years · Full responsibility" data-am="2 ዓመት · ሙሉ ኃላፊነት"></h3>
    <div class="price">100,000 <small data-en="ETB, paid once" data-am="ብር፣ በአንድ ጊዜ"></small></div>
    <p data-en="Everything below, for 2 years, with full responsibility for your data." data-am="ከታች ያለው ሁሉ ለ2 ዓመት፣ ለመረጃዎ ሙሉ ኃላፊነት ጋር።"></p>
  </div>
  <div class="card star">
    <h3 data-en="2 years · We promote ClinicOS with your name" data-am="2 ዓመት · በክሊኒክዎ ስም ClinicOSን እናስተዋውቃለን"></h3>
    <div class="price">75,000 <small data-en="ETB, paid once" data-am="ብር፣ በአንድ ጊዜ"></small></div>
    <p data-en="Same service and full responsibility at a lower price, because we promote ClinicOS with videos that use your clinic name." data-am="ተመሳሳይ አገልግሎት እና ሙሉ ኃላፊነት በቅናሽ ዋጋ፤ ምክንያቱም ClinicOSን የክሊኒክዎን ስም በመጠቀም በቪዲዮ እናስተዋውቃለን።"></p>
  </div>
</div>
<h2 data-en="Monthly packages" data-am="ወርሃዊ ፓኬጆች"></h2>
<div class="grid">
  <div class="card">
    <h3 data-en="Starter" data-am="ጀማሪ"></h3>
    <div class="price">4,900 <small data-en="ETB / month" data-am="ብር / በወር"></small></div>
    <p data-en="1 branch." data-am="1 ቅርንጫፍ።"></p>
  </div>
  <div class="card">
    <h3 data-en="Business" data-am="ቢዝነስ"></h3>
    <div class="price">5,900 <small data-en="ETB / month" data-am="ብር / በወር"></small></div>
    <p data-en="2 branches. Each extra branch adds 2,000 ETB / month." data-am="2 ቅርንጫፎች። እያንዳንዱ ተጨማሪ ቅርንጫፍ በወር 2,000 ብር ይጨምራል።"></p>
  </div>
  <div class="card">
    <h3 data-en="New dental clinic" data-am="አዲስ የጥርስ ክሊኒክ"></h3>
    <div class="price">from 1,000 <small data-en="ETB / month" data-am="ብር / በወር"></small></div>
    <p data-en="Starts small with a limited patient number and grows with you. Agreed clinic by clinic." data-am="በትንሹ ይጀምራል፣ የታካሚ ቁጥር ውስን ሲሆን አብሮዎ ያድጋል። ከእያንዳንዱ ክሊኒክ ጋር ይስማማል።"></p>
  </div>
</div>
<h2 data-en="Build your own plan" data-am="የራስዎን ፓኬጅ ይገንቡ"></h2>
<p class="sub" data-en="One-time setup of 35,000 ETB, then 2,000 ETB / month with 3,000 patients, 5 GB, 1 branch and SMS. Add what you need and see your price." data-am="የአንድ ጊዜ ክፍያ 35,000 ብር፣ ከዚያ በወር 2,000 ብር — 3,000 ታካሚ፣ 5 GB፣ 1 ቅርንጫፍ እና SMS ጋር። የሚፈልጉትን ያክሉ፣ ዋጋዎን ይመልከቱ።"></p>
<div class="calc"><div class="card" style="padding-top:8px;padding-bottom:8px">
<div class="crow"><div><span data-en="Patients" data-am="ታካሚዎች"></span><small data-en="3,000 included · +1,000 for 600 ETB / month" data-am="3,000 ተካትቷል · +1,000 በወር 600 ብር"></small></div><div class="step"><button data-k="p" data-d="-1" aria-label="-">−</button><b id="v-p"></b><button data-k="p" data-d="1" aria-label="+">+</button></div></div>
<div class="crow"><div><span data-en="Storage" data-am="ማከማቻ"></span><small data-en="5 GB included · +5 GB for 400 ETB / month" data-am="5 GB ተካትቷል · +5 GB በወር 400 ብር"></small></div><div class="step"><button data-k="s" data-d="-1" aria-label="-">−</button><b id="v-s"></b><button data-k="s" data-d="1" aria-label="+">+</button></div></div>
<div class="crow"><div><span data-en="Branches" data-am="ቅርንጫፎች"></span><small data-en="1 included · +1 branch for 1,500 ETB / month" data-am="1 ተካትቷል · +1 ቅርንጫፍ በወር 1,500 ብር"></small></div><div class="step"><button data-k="b" data-d="-1" aria-label="-">−</button><b id="v-b"></b><button data-k="b" data-d="1" aria-label="+">+</button></div></div>
<div class="crow"><div><span data-en="Payment verification" data-am="የክፍያ ማረጋገጫ"></span><small data-en="Not included · 500 ETB / month" data-am="አልተካተተም · በወር 500 ብር"></small></div><button class="tog" id="tv"></button></div>
<div class="crow"><div><span data-en="SMS feature" data-am="የSMS አገልግሎት"></span><small data-en="Included (message costs are separate)" data-am="ተካትቷል (የመልዕክት ወጪ በተናጠል)"></small></div><span data-en="Included" data-am="ተካትቷል" style="color:var(--teal);font-weight:600"></span></div>
</div>
<div class="sum">
  <div class="lbl" data-en="Pay once" data-am="አንድ ጊዜ ይክፈሉ"></div><div class="big"><span id="t-once">35,000</span> <small style="font-size:14px" data-en="ETB" data-am="ብር"></small></div>
  <div class="lbl" data-en="Then every month" data-am="ከዚያ በየወሩ"></div><div class="big"><span id="t-mo"></span> <small style="font-size:14px" data-en="ETB / month" data-am="ብር / በወር"></small></div>
  <div class="lbl" data-en="Your plan" data-am="ፓኬጅዎ"></div><div id="t-sum" style="font-size:14px;line-height:1.7"></div>
</div></div>
<h2 data-en="Limits on every package" data-am="በሁሉም ፓኬጅ ያሉ ገደቦች"></h2>
<div class="scroll"><table><thead><tr><th data-en="What" data-am="ምን"></th><th class="r" data-en="Included" data-am="የተካተተ"></th><th class="r" data-en="Add more" data-am="ተጨማሪ"></th></tr></thead><tbody>
<tr><td data-en="Patients" data-am="ታካሚዎች"></td><td class="r">5,000</td><td class="r" data-en="+1,000 for 500 ETB / month" data-am="+1,000 በወር 500 ብር"></td></tr>
<tr><td data-en="Storage (images, files)" data-am="ማከማቻ (ምስሎች፣ ፋይሎች)"></td><td class="r">5 GB</td><td class="r" data-en="+5 GB for 500 ETB / month" data-am="+5 GB በወር 500 ብር"></td></tr>
<tr><td data-en="Patient SMS" data-am="የታካሚ SMS"></td><td class="r" data-en="Not included" data-am="አልተካተተም"></td><td class="r" data-en="Charged separately" data-am="በተናጠል ይከፈላል"></td></tr>
<tr><td data-en="Payment verification" data-am="የክፍያ ማረጋገጫ"></td><td class="r" data-en="Included" data-am="ተካትቷል"></td><td class="r">—</td></tr>
</tbody></table></div>
<div class="note" data-en="Storage and payment-verification prices can change if the outside companies that provide them change their prices." data-am="የማከማቻ እና የክፍያ ማረጋገጫ ዋጋ፣ አቅራቢ ድርጅቶቹ ዋጋቸውን ከቀየሩ ሊቀየር ይችላል።"></div>
<h2 data-en="What you get" data-am="የሚያገኙት"></h2>
<div class="grid" style="grid-template-columns:repeat(2,1fr)">
<div class="card"><p style="margin:0;color:var(--ink)" data-en="Full responsibility for your data, in a legal agreement we sign with you." data-am="ለመረጃዎ ሙሉ ኃላፊነት፣ ከእርስዎ ጋር በምንፈርመው ሕጋዊ ስምምነት።"></p></div>
<div class="card"><p style="margin:0;color:var(--ink)" data-en="Backups of your data twice a day, and restoring it if anything is lost." data-am="መረጃዎ በቀን ሁለት ጊዜ ይቀመጣል፣ ቢጠፋም መልሰን እናመጣዋለን።"></p></div>
<div class="card"><p style="margin:0;color:var(--ink)" data-en="Full and continuous support." data-am="ሙሉ እና ቀጣይነት ያለው ድጋፍ።"></p></div>
<div class="card"><p style="margin:0;color:var(--ink)" data-en="Training for you and your staff." data-am="ለእርስዎ እና ለሠራተኞችዎ ሥልጠና።"></p></div>
<div class="card"><p style="margin:0;color:var(--ink)" data-en="The system adjusted to your clinic's structure now, and again when it changes." data-am="ሲስተሙ ለክሊኒክዎ አወቃቀር ተስተካክሎ ይሰጣል፣ ሲቀየርም እንደገና።"></p></div>
<div class="card"><p style="margin:0;color:var(--ink)" data-en="Tooth chart, treatment plans, instalments, front desk, cashier, reports — all included." data-am="የጥርስ ቻርት፣ የሕክምና ዕቅድ፣ በዕቅድ ክፍያ፣ መቀበያ፣ ገንዘብ ያዥ፣ ሪፖርቶች — ሁሉም ተካትተዋል።"></p></div>
</div>
<h2 data-en="Bring clinics for a 2-year package, get money back" data-am="ክሊኒኮችን ለ2 ዓመት ፓኬጅ ያምጡ፣ ገንዘብ ይመለስ"></h2>
<p class="sub" data-en="Subscribe in full first. Each different clinic you bring on a 2-year package pays back part of your fee. Your own clinic does not count." data-am="መጀመሪያ ሙሉ ይክፈሉ። በ2 ዓመት ፓኬጅ የሚያመጡት እያንዳንዱ ሌላ ክሊኒክ ከክፍያዎ የተወሰነውን ይመልሳል። የእርስዎ ክሊኒክ አይቆጠርም።"></p>
<p class="sub" style="margin-top:14px;font-weight:600;color:var(--ink)" data-en="Refunds below are for the 75,000 package (2 years)." data-am="ከታች ያለው ተመላሽ ለ75,000 ፓኬጅ (2 ዓመት) ነው።"></p>
<div class="scroll"><table><thead><tr><th data-en="Clinic you bring" data-am="ያመጡት ክሊኒክ"></th><th class="r" data-en="75,000 package becomes" data-am="የ75,000 ፓኬጅ ይሆናል"></th><th class="r" data-en="Refunded to you" data-am="የሚመለስልዎ"></th></tr></thead><tbody>
<tr><td data-en="1st clinic" data-am="1ኛ ክሊኒክ"></td><td class="r">68,000</td><td class="r">7,000</td></tr>
<tr><td data-en="2nd clinic" data-am="2ኛ ክሊኒክ"></td><td class="r">58,000</td><td class="r">10,000</td></tr>
<tr><td data-en="3rd clinic" data-am="3ኛ ክሊኒክ"></td><td class="r">48,000</td><td class="r">10,000</td></tr>
</tbody></table></div>
<div class="note" data-en="The refund amounts are the same whether you took the 75,000 or the 100,000 package: 27,000 ETB back after 3 clinics. You are paid back as each clinic joins — no need to wait for all three." data-am="ተመላሹ በ75,000 ወይም በ100,000 ፓኬጅ ተመሳሳይ ነው፦ ከ3 ክሊኒኮች በኋላ 27,000 ብር። እያንዳንዱ ክሊኒክ እንደተቀላቀለ ይመለስልዎታል — ሦስቱን መጠበቅ አያስፈልግም።"></div>

<script>
function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-en]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
  document.getElementById('b-en').classList.toggle('on',l==='en');
  document.getElementById('b-am').classList.toggle('on',l==='am');
  try{localStorage.setItem('lang',l)}catch(x){}
  calc();
}
document.getElementById('b-en').onclick=function(){setLang('en')};
document.getElementById('b-am').onclick=function(){setLang('am')};

var C={p:0,s:0,b:0,v:0};
function fmt(n){return n.toLocaleString('en-US')}
function calc(){
  var l=document.documentElement.lang;
  var mo=2000+C.p*600+C.s*400+C.b*1500+C.v*500;
  document.getElementById('v-p').textContent=fmt(3000+C.p*1000);
  document.getElementById('v-s').textContent=(5+C.s*5)+' GB';
  document.getElementById('v-b').textContent=1+C.b;
  var t=document.getElementById('tv');t.classList.toggle('on',!!C.v);
  t.textContent=C.v?(l==='am'?'ተካትቷል ✓':'Added ✓'):(l==='am'?'ጨምር':'Add');
  document.getElementById('t-mo').textContent=fmt(mo);
  document.getElementById('t-sum').textContent=fmt(3000+C.p*1000)+(l==='am'?' ታካሚ · ':' patients · ')+(5+C.s*5)+' GB · '+(1+C.b)+(l==='am'?' ቅርንጫፍ · SMS':' branch(es) · SMS')+(C.v?(l==='am'?' · የክፍያ ማረጋገጫ':' · payment verification'):'');
}
document.querySelectorAll('.step button').forEach(function(b){b.onclick=function(){var k=b.dataset.k;C[k]=Math.max(0,C[k]+ +b.dataset.d);calc()}});
document.getElementById('tv').onclick=function(){C.v=C.v?0:1;calc()};
var s='en';try{s=localStorage.getItem('lang')||'en'}catch(x){}
setLang(s);
</script>
