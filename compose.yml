# Base service graph for the modular monolith. Compose with an environment
# overlay, e.g.:
#   docker compose -f compose.yml -f compose.dev.yml up --build
# Required .env vars: JWT_SECRET, MFA_ENC_KEY (see .env.example).

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  # Public web URL used to build staff invite / accept-invite links. Set to the
  # real domain in prod (.env); the localhost default is for local dev only.
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
  # api/worker connect as the least-privilege clinic_app role so RLS is enforced
  # (the superuser would bypass it). Migrations run as the superuser (see migrate).
  DATABASE_URL: postgres://clinic_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-clinic}?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_ISSUER: ${JWT_ISSUER:-clinicsaas}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
  LOCKOUT_DURATION: ${LOCKOUT_DURATION:-15m}
  MFA_ENC_KEY: ${MFA_ENC_KEY:?set MFA_ENC_KEY in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-clinic}
  # Object storage: "r2" (Cloudflare R2, S3-compatible) or "cloudinary". Empty =
  # auto (R2 if configured, else Cloudinary). R2 creds are secrets (VPS .env only).
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  # Deepgram speech-to-text for clinician voice dictation. Empty = feature disabled.
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
  DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-en}
  # AI clinical decision-support co-pilot (ClinicOS Assist). Empty = feature disabled.
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-meta/llama-3.3-70b-instruct}
  AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
  # DHIS2 (Ministry of Health) reporting showcase. Empty token = push disabled.
  DHIS2_TOKEN: ${DHIS2_TOKEN:-}
  DHIS2_BASE_URL: ${DHIS2_BASE_URL:-https://dhis.moh.gov.et}
  # Patient SMS (SMSEthiopia, direct Ethio Telecom). One platform account serves
  # every clinic; per-clinic spend is capped by the subscription plan. Empty key =
  # messages are written to the log instead of sent, and every surface says so.
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_BASE_URL: ${SMS_BASE_URL:-https://smsethiopia.com}
  # Display-only: what one segment costs us, used to price a send before it happens.
  SMS_COST_PER_SEGMENT: ${SMS_COST_PER_SEGMENT:-0.25}
  RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      # Used by the init script to create the least-privilege app login role.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic}@postgres:5432/${POSTGRES_DB:-clinic}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    command: ["/app/api"]
    environment:
      <<: *backend-env
      API_HTTP_ADDR: ":8080"
      # Privileged (RLS-bypassing) DSN used ONLY by the platform/super-admin module to
      # provision tenants across the boundary. Uses the DB superuser; gated behind
      # platform-admin auth. Empty disables the platform surface.
      PLATFORM_DATABASE_URL: postgres://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic}@postgres:5432/${POSTGRES_DB:-clinic}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"

  worker:
    build:
      context: ./backend
    command: ["/app/worker"]
    environment:
      <<: *backend-env
      # The message dispatcher drains one queue across every tenant, so it needs the
      # same RLS-bypassing DSN the platform module uses. It never returns rows to a
      # user: it reads what is due, then does the work inside a tenant-scoped
      # transaction so the clinic's own policies still apply to the write.
      PLATFORM_DATABASE_URL: postgres://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic}@postgres:5432/${POSTGRES_DB:-clinic}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - api

volumes:
  pgdata:
