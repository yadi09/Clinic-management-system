# Dev overlay: expose Postgres, API, and the web edge to the host for
# convenient local access and direct API calls.
#   docker compose -f compose.yml -f compose.dev.yml up --build
services:
  postgres:
    ports:
      - "5432:5432"

  api:
    environment:
      APP_ENV: dev
    ports:
      - "8080:8080"

  worker:
    environment:
      APP_ENV: dev

  web:
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "${WEB_HTTP_PORT:-8088}:80"
