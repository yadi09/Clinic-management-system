name: CI

# The regression gate. Every push to a deployable branch and every pull request runs
# the whole suite; a red run means "do not deploy". See TESTING.md.
on:
  push:
    branches: [main, master, "refine/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend · build, vet, boundaries, unit
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: backend/go.sum }
      - run: go build ./...
      - run: go vet ./...
      - name: Module boundary lint
        run: go run ./tools/importlint
      - name: Unit tests (no database)
        run: go test ./... -short -count=1
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.31.1" }
      # Informational until the stale models are regenerated deliberately (audit TST-2 /
      # CQ-5): hand-written SQL in several modules makes a blind regenerate risky.
      - name: sqlc generated code is up to date (informational)
        continue-on-error: true
        run: |
          sqlc generate
          git diff --exit-code -- 'internal/**/repo/gen' || \
            (echo "::warning::sqlc generated code is stale — regenerate deliberately"; exit 1)

  regression:
    name: Backend · integration + API regression
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: regress
          POSTGRES_DB: clinic_regress
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # A throwaway service container. The suite refuses anything not local or not
      # named *test*/*regress*.
      TEST_DATABASE_URL: postgres://postgres:regress@localhost:5432/clinic_regress?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: backend/go.sum }
      - name: Every Go test against a real database
        run: |
          set -o pipefail
          go test ./... -count=1 -p 1 -json 2>&1 \
            | python3 ../scripts/test/summarize.py --title "Backend regression" --junit regression.xml \
            | tee summary.txt
      - name: Publish summary
        if: always()
        run: |
          { echo '```'; cat summary.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-regression, path: "backend/regression.xml\nbackend/summary.txt" }

  frontend:
    name: Frontend · lint, typecheck, unit, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Lint (incl. rules-of-hooks)
        run: npx eslint src --quiet
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - run: npm run build

  e2e:
    name: End-to-end journeys
    needs: [regression, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: regress
          POSTGRES_DB: clinic_regress
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:regress@localhost:5432/clinic_regress?sslmode=disable
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
