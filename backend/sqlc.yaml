version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/identity/repo/queries
    gen:
      go:
        package: identitydb
        out: internal/identity/repo/gen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - { db_type: uuid, go_type: { import: github.com/google/uuid, type: UUID } }
          - { db_type: uuid, nullable: true, go_type: { import: github.com/google/uuid, type: UUID, pointer: true } }
          - { db_type: timestamptz, go_type: { type: time.Time } }
          - { db_type: timestamptz, nullable: true, go_type: { type: time.Time, pointer: true } }
          - { db_type: date, go_type: { type: time.Time } }
          - { db_type: date, nullable: true, go_type: { type: time.Time, pointer: true } }
          - { db_type: jsonb, go_type: { type: string } }
          - { db_type: jsonb, nullable: true, go_type: { type: string, pointer: true } }

