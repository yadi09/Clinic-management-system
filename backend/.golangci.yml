run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - revive
    - gosec
    - bodyclose
    - sqlclosecheck

issues:
  exclude-rules:
    # generated SQLC code is not ours to lint
    - path: internal/.*/repo/gen/.*
      linters: [revive, staticcheck, gosec, errcheck, unused]
  max-issues-per-linter: 0
  max-same-issues: 0

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  gosec:
    excludes:
      - G115 # integer overflow conversions are reviewed case-by-case
