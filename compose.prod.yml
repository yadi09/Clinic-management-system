# Production overlay: always-restart, no host DB/API exposure, TLS via Caddy
# (set SITE_ADDRESS to your domain so Let's Encrypt provisions a cert), and
# conservative resource limits suited to a single Oracle Cloud VPS.
#   SITE_ADDRESS=clinic.example.com docker compose -f compose.yml -f compose.prod.yml up -d --build
services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g

  api:
    environment:
      APP_ENV: prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    environment:
      APP_ENV: prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to your domain for TLS}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
